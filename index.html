<!doctype html>
<html lang="en">
<head>
<script data-rr-gh>if(/github\.io$/.test(location.hostname))location.replace('https://rankrebels.ai/status/michel/'+location.search+location.hash)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>The Sunset Beach House: website progress | Rank Rebels</title><meta property="og:type" content="website"><meta property="og:site_name" content="Rank Rebels"><meta property="og:title" content="The Sunset Beach House: website progress"><meta property="og:description" content="5 of 10 steps done (50%). Your website is coming along beautifully | Rank Rebels"><meta property="og:url" content="https://rankrebels.ai/status/michel/"><meta property="og:image" content="https://rankrebels.ai/status/michel/og.png"><meta property="og:image:type" content="image/png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="The Sunset Beach House: website progress"><meta name="twitter:description" content="5 of 10 steps done (50%). Your website is coming along beautifully | Rank Rebels"><meta name="twitter:image" content="https://rankrebels.ai/status/michel/og.png">
<style>
:root{--ink:#14171a;--ink2:#575d57;--cream:#f4f2ea;--line:#e3e0d5;--acc:#c2340f;--acc2:#ff8a3d;--ok:#15803d;--card:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:18px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;padding-bottom:92px}
header{background:var(--ink);color:#fff;padding:22px 18px 26px;padding-top:max(22px,env(safe-area-inset-top))}
.brand{font-weight:800;letter-spacing:.04em;font-size:14px;text-transform:uppercase;color:var(--acc2)}
.brand b{color:#fff}
h1{font-size:30px;line-height:1.15;margin:14px 0 6px}
.sub{color:#e3e6e8;margin:0 0 16px;font-size:18px}
.bar{height:10px;background:#2b3035;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .6s}
.barlab{display:flex;justify-content:space-between;font-size:15px;color:#e3e6e8;margin-top:8px}
main{max-width:640px;margin:0 auto;padding:18px}
.est{background:#fff;border:2px solid var(--acc2);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.est .k{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.est .d{font-size:28px;font-weight:800;margin:2px 0}
.est .t{font-size:16.5px;color:var(--ink2)}
.est.early{border-color:var(--ok)}
.est.early .k{color:var(--ok)}
.now{background:#fff3e8;border:1px solid #ffd7b5;border-radius:14px;padding:14px 16px;margin-bottom:20px}
.now strong{display:block;margin-bottom:2px}
ol.steps{list-style:none;margin:0;padding:0;position:relative}
.step{position:relative;padding:0 0 18px 52px}
.step:before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:3px;background:var(--line)}
.step:last-child:before{display:none}
.step.done:before{background:var(--ok)}
.dot{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#fff;border:3px solid var(--line);color:var(--ink2)}
.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.active .dot{border-color:var(--acc);color:var(--acc)}
.waiting .dot{border-color:var(--acc2);background:#fff3e8;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card h2{margin:0;font-size:21px}
.badge{font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px;background:#eceae0;color:var(--ink2);white-space:nowrap}
.done .badge{background:#dcf5e4;color:var(--ok)}
.active .badge{background:#ffe6d6;color:var(--acc)}
.waiting .badge{background:#ffe6d6;color:var(--acc)}
.upcoming .card{opacity:.82}
.note{margin:8px 0 0;color:#454a45;font-size:17.5px}
.chk{list-style:none;margin:12px 0 0;padding:0}
.chk li{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--acc2);display:grid;place-items:center;font-size:15px;color:#fff;font-weight:800}
.chk li.ok .box{background:var(--ok);border-color:var(--ok)}
.chk b{display:block}
.chk span.s{display:block;color:var(--ink2);font-size:14.5px;margin-top:2px}
.stats{display:grid;gap:10px;margin:12px 0 0}
.stat{background:var(--cream);border-radius:10px;padding:10px 12px}
.stat .v{font-size:20px;font-weight:800}
.stat .l{font-size:13px;color:var(--ink2)}
.fine{font-size:12.5px;color:var(--ink2);margin:10px 0 0}
ul.items{margin:10px 0 0;padding-left:22px;color:#454a45;font-size:17.5px}
ul.items li{margin:4px 0}
.btn{display:block;text-align:center;text-decoration:none;font-weight:800;border-radius:12px;padding:13px 16px;margin-top:12px;background:var(--acc);color:#fff}
.btn.alt{background:var(--ink)}
footer{max-width:640px;margin:0 auto;padding:6px 18px 24px;color:var(--ink2);font-size:15px}
.contact{position:fixed;left:0;right:0;bottom:0;background:var(--ink);padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;gap:10px}
.contact a{flex:1;text-align:center;text-decoration:none;color:#fff;font-weight:700;font-size:18px;border-radius:10px;padding:14px 6px;background:#2b3035}
.contact a.p{background:var(--acc)}
noscript{display:block;padding:18px}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Rank</b> Rebels</div>
  <h1 id="h1">Your website progress</h1>
  <p class="sub" id="sub"></p>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="pb"><i id="fill"></i></div>
  <div class="barlab"><span id="steplab"></span><span id="upd"></span></div>
</header>
<main>
  <div class="est" id="est" hidden><div class="k" id="estk"></div><div class="d" id="estd"></div><div class="t" id="estt"></div></div>
  <div class="now" id="now" hidden><strong id="nowh"></strong><span id="nowm"></span></div>
  <ol class="steps" id="steps"></ol>
</main>
<footer>This page tracks the work on your website. It does not promise rankings, traffic or bookings. Results depend on many things outside anyone's control. Private page for Michel Rubini.</footer>
<nav class="contact" id="contact"></nav>
<noscript>Please turn on JavaScript to see your progress, or call or text Brandon at (808) 265-5339.</noscript>
<script>
(function(){
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function render(d){
    document.getElementById('h1').textContent=d.headline||'Your website progress';
    document.getElementById('sub').textContent=(d.greeting?d.greeting+'. ':'')+(d.client?'Here is where '+d.client+' stands.':'');
    document.getElementById('upd').textContent=d.updated?'Updated '+d.updated:'';
    if(d.message){document.getElementById('now').hidden=false;document.getElementById('nowh').textContent=d.headline||'';document.getElementById('nowm').textContent=d.message}
    (function(){var e=d.estimate,box=document.getElementById('est');if(!e||!e.iso){box.hidden=true;return}
      function fmt(i){return new Date(i+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'UTC'})}
      box.hidden=false;box.className='est';
      var dv=d.delivered&&d.delivered.iso;
      if(dv){var days=Math.round((new Date(e.iso+'T12:00:00Z')-new Date(dv+'T12:00:00Z'))/864e5);
        document.getElementById('estk').textContent='Delivered';document.getElementById('estd').textContent=fmt(dv);
        if(days>0){box.className='est early';document.getElementById('estt').textContent='That is '+days+(days===1?' day':' days')+' ahead of the '+fmt(e.iso)+' estimate.'}
        else document.getElementById('estt').textContent='Our estimate was '+fmt(e.iso)+'.';}
      else{document.getElementById('estk').textContent='Estimated delivery';document.getElementById('estd').textContent=fmt(e.iso);
        document.getElementById('estt').textContent=e.note||'This is the date we are working toward. If we finish sooner, we will show you here.';}
    })();
    var st=d.stages||[],done=st.filter(function(s){return s.state==='done'}).length;
    document.getElementById('fill').style.width=Math.round(done/st.length*100)+'%';
    document.getElementById('pb').setAttribute('aria-valuenow',Math.round(done/st.length*100));
    document.getElementById('steplab').textContent=done+' of '+st.length+' steps done';
    var ol=document.getElementById('steps');ol.textContent='';
    st.forEach(function(s,i){
      var li=el('li','step '+s.state);
      li.appendChild(el('div','dot',s.state==='done'?'\u2713':String(i+1)));
      var c=el('div','card'),r=el('div','row');
      r.appendChild(el('h2',null,s.title));r.appendChild(el('span','badge',s.badge||s.state));c.appendChild(r);
      if(s.note)c.appendChild(el('p','note',s.note));
      if(s.checklist){var u=el('ul','chk');s.checklist.forEach(function(k){
        var x=el('li',k.done?'ok':'');x.appendChild(el('div','box',k.done?'\u2713':''));
        var b=el('div');b.appendChild(el('b',null,k.title));b.appendChild(el('span','s',k.steps));x.appendChild(b);u.appendChild(x)});c.appendChild(u)}
      if(s.stats){var g=el('div','stats');s.stats.forEach(function(k){var t=el('div','stat');t.appendChild(el('div','v',k.value));t.appendChild(el('div','l',k.label+(k.hint?' ('+k.hint+')':'')));g.appendChild(t)});c.appendChild(g)}
      if(s.fine)c.appendChild(el('p','fine',s.fine));
      if(s.items){var u2=el('ul','items');s.items.forEach(function(k){u2.appendChild(el('li',null,k))});c.appendChild(u2)}
      if(s.link&&s.link.url&&/^https:\/\//.test(s.link.url)){var la=el('a','btn alt',s.link.label||'Open link');la.href=s.link.url;la.target='_blank';la.rel='noopener noreferrer';c.appendChild(la);if(s.link.hint)c.appendChild(el('p','fine',s.link.hint))}
      if(s.button==='pay'&&d.payUrl){var a=el('a','btn','Pay invoice'+(d.payAmount?' ('+d.payAmount+')':''));a.href=d.payUrl;a.rel='noopener noreferrer';c.appendChild(a)}
      li.appendChild(c);ol.appendChild(li)});
    var n=document.getElementById('contact');n.textContent='';
    var call=el('a','p','Call Brandon');call.href='tel:'+(d.phoneTel||'');
    var sms=el('a',null,'Text Brandon');sms.href='sms:'+(d.phoneTel||'');
    n.appendChild(call);n.appendChild(sms);
    if(d.phone)call.setAttribute('aria-label','Call Brandon at '+d.phone);
  }
  fetch('status.json?'+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(render).catch(function(){
    document.getElementById('sub').textContent='Could not load the latest update. Please call or text Brandon at (808) 265-5339.';
  });
})();
</script>
</body>
</html>
